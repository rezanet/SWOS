[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swos-prose"
version = "0.4.0-dev"
description = "Semantic-safe prose editing and autonomous governed research-writing runtime for SWOS"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "SWOS Contributors"}]
license = {text = "MIT"}
dependencies = [
    "openai>=1.70.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=5.0.0,<6"]
ontology = ["rdflib==7.6.0", "pyshacl==0.40.1"]
training = ["sentence-transformers==6.0.1"]
prov = ["prov==3.1.0"]
research-grade = [
    "rdflib==7.6.0",
    "pyshacl==0.40.1",
    "sentence-transformers==6.0.1",
    "prov==3.1.0",
]

[project.scripts]
swos-prose = "swos_prose.cli:main"
swos = "swos_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swos_prose*", "swos_runtime*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"benchmark/*.py" = ["E402"]

[tool.ruff.format]
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["swos_prose", "swos_runtime"]
omit = ["*/swos_runtime/legacy_openai_orchestrator.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
