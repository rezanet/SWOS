name: Bug report
description: Report a reproducible problem in SWOS
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough detail for another person to reproduce it.

  - type: input
    id: version
    attributes:
      label: SWOS version or commit
      description: Release tag, branch, or commit SHA where the problem occurs.
      placeholder: v1.0.0 or abc1234
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, host/runtime, model/provider if relevant, and any other execution context.
      placeholder: |
        OS: Ubuntu 24.04
        Python: 3.11
        Runtime: Claude Code / Codex / CLI / other
        Provider/model: if relevant
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reproducible sequence of commands, inputs, or actions.
      placeholder: |
        1. Run ...
        2. Provide ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include relevant error output, semantic-delta status, or CI result.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, fixtures, or minimal example
      description: Paste only the minimum needed. Remove secrets, private data, copyrighted source text, and API keys.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets and sensitive data from this report.
          required: true
