name: Temporary Runtime Formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-runtime:
    if: github.head_ref == 'programme/autonomous-swos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: programme/autonomous-swos
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked Ruff
        run: python -m pip install --requirement requirements-dev.lock
      - name: Apply repository formatter
        run: python -m ruff format swos_runtime evals/harness tests/runtime tools/validate_autonomous_run.py
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "Reza Negarestani"
          git config user.email "13441247+rezanet@users.noreply.github.com"
          git add swos_runtime evals/harness tests/runtime tools/validate_autonomous_run.py
          git commit -m "style(runtime): apply governed Ruff formatting" -m "Signed-off-by: Reza Negarestani <13441247+rezanet@users.noreply.github.com>"
          git push origin HEAD:programme/autonomous-swos
