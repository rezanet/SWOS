name: SWOS Prose Live

# Live model evaluation runs only on trusted repository pushes or manual dispatch.
# Pull requests are intentionally excluded so repository secrets are never
# exposed to fork-originated PR workflows.
on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
  workflow_dispatch:

jobs:
  live-prose:
    name: GPT-5.6 Luna verifier and dogfood
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SWOS_PROSE_RUN_LIVE_OPENAI: '1'
      SWOS_PROSE_OPENAI_MODEL: gpt-5.6-luna
      SWOS_PROSE_OPENAI_REWRITE_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Report live-test skip when no API key is configured
        if: env.OPENAI_API_KEY == ''
        run: echo 'OPENAI_API_KEY is not configured; live SWOS Prose evaluation skipped.'

      - name: Install OpenAI SDK
        if: env.OPENAI_API_KEY != ''
        run: python3 -m pip install openai

      - name: Run live semantic-verifier regressions
        if: env.OPENAI_API_KEY != ''
        run: python3 -m unittest discover -s tests/prose -p 'test_openai_live.py'

      - name: Run five-case polish dogfood batch
        if: env.OPENAI_API_KEY != ''
        run: |
          rm -rf /tmp/swos-prose-dogfood
          python3 -m swos_prose.cli dogfood \
            --input-dir tests/prose/fixtures/live_dogfood \
            --output-dir /tmp/swos-prose-dogfood \
            --assurance strict \
            --rewriter-model gpt-5.6-luna \
            --verifier-model gpt-5.6-luna
          cat /tmp/swos-prose-dogfood/summary.json

      - name: Upload dogfood evidence
        if: env.OPENAI_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: swos-prose-live-dogfood
          path: /tmp/swos-prose-dogfood
          retention-days: 7
