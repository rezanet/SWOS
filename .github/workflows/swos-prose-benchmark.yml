name: SWOS Prose Benchmark

on:
  pull_request:
  workflow_dispatch:

jobs:
  benchmark-contract:
    name: Prose benchmark corpus contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark schema validator
        run: python3 -m pip install jsonschema
      - name: Validate 76-case G-Prose95 corpus and diagnostics contract
        run: |
          python3 benchmark/runner.py \
            --mode validate \
            --expect-count 76 \
            --output /tmp/swos-prose-benchmark-validate.json
          cat /tmp/swos-prose-benchmark-validate.json
      - name: Validate bounded M1 repair contract
        run: |
          python3 benchmark/repair_contract.py \
            --output /tmp/swos-prose-repair-contract.json
          cat /tmp/swos-prose-repair-contract.json

  benchmark-live:
    name: Prose benchmark live G-Prose95 evidence (non-gating)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SWOS_PROSE_RUN_LIVE_OPENAI: "1"
      SWOS_PROSE_OPENAI_MODEL: gpt-5.6-luna
      SWOS_PROSE_OPENAI_REWRITE_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record exact dispatch SHA
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/swos-prose-benchmark-sha.txt
      - name: Require configured live provider credential
        run: |
          set -euo pipefail
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "OPENAI_API_KEY is absent. Live benchmark evidence is NOT RUN and cannot pass." >&2
            exit 2
          fi
      - name: Install OpenAI SDK
        run: python3 -m pip install openai jsonschema
      - name: Run full 76-case live G-Prose95 benchmark
        id: live-benchmark
        run: |
          set -euo pipefail
          rm -rf /tmp/swos-prose-benchmark
          mkdir -p /tmp/swos-prose-benchmark
          python3 benchmark/runner.py \
            --mode all \
            --expect-count 76 \
            --stability-runs 5 \
            --rewriter-model gpt-5.6-luna \
            --verifier-model gpt-5.6-luna \
            --fail-on-unsafe \
            --output /tmp/swos-prose-benchmark/g-prose95.json
      - name: Require complete live benchmark evidence
        run: |
          set -euo pipefail
          test -s /tmp/swos-prose-benchmark-sha.txt
          test -s /tmp/swos-prose-benchmark/g-prose95.json
      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo "## SWOS Prose G-Prose95 benchmark"
            echo
            echo "Selected exact SHA: $(cat /tmp/swos-prose-benchmark-sha.txt 2>/dev/null || echo unavailable)"
            echo
            echo "Live benchmark step outcome: ${{ steps.live-benchmark.outcome }}"
            echo
            if [[ -f /tmp/swos-prose-benchmark/g-prose95.json ]]; then
              python3 -c 'import json; r=json.load(open("/tmp/swos-prose-benchmark/g-prose95.json")); print("Corpus:", r["corpus"]["fixture_count"]); print("Unsafe diagnostic abstentions:", len(r["diagnostics_contract"]["unsafe_abstentions"])); print("Unsafe semantic PASSes:", r["semantic_safety"]["unsafe_pass_count"]); print("Diagnostics abstentions:", r["token_efficiency"]["abstention_count"]); print("Observed/counterfactual token savings %:", r["token_efficiency"]["total_token_savings_percent"]); print("Stability draws per probe:", r["stability"]["runs_per_probe"])'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload live benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swos-prose-g-prose95-benchmark
          path: |
            /tmp/swos-prose-benchmark-sha.txt
            /tmp/swos-prose-benchmark
          retention-days: 14
