name: One-shot Autonomous Research Expansion Patch

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-research-expansion.yml"

permissions:
  contents: write

jobs:
  patch-runtime:
    if: github.head_ref == 'programme/autonomous-swos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: programme/autonomous-swos
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clear stale retrieval blocker after successful expansion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('swos_runtime/orchestrator.py')
          text = path.read_text(encoding='utf-8')
          old = '''            labels = self._source_labels(ranked)\n            rebuild_evidence()\n\n        labels = self._source_labels(ranked)\n'''
          new = '''            labels = self._source_labels(ranked)\n            rebuild_evidence()\n\n        if sources:\n            blockers = [\n                blocker\n                for blocker in blockers\n                if blocker != "No retrievable sources were available."\n            ]\n\n        labels = self._source_labels(ranked)\n'''
          if text.count(old) != 1:
              raise SystemExit('post-expansion blocker anchor mismatch')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Install locked developer tools
        run: python -m pip install --requirement requirements-dev.lock
      - name: Format, lint and run runtime tests
        run: |
          python -m ruff format swos_runtime/orchestrator.py
          python -m ruff check swos_runtime/orchestrator.py
          python -m unittest discover -s tests/runtime -p 'test_*.py'
      - name: Commit stale-blocker fix
        run: |
          git config user.name "Reza Negarestani"
          git config user.email "13441247+rezanet@users.noreply.github.com"
          git add swos_runtime/orchestrator.py
          git commit -m "fix(runtime): clear stale retrieval blocker after expansion" -m "Signed-off-by: Reza Negarestani <13441247+rezanet@users.noreply.github.com>"
          git push origin HEAD:programme/autonomous-swos
