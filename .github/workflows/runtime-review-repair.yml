name: One-shot Reviewer Research Repair Patch

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-review-repair.yml"

permissions:
  contents: write

jobs:
  patch-review-repair:
    if: github.head_ref == 'programme/autonomous-swos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: programme/autonomous-swos
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Add reviewer-driven research repair
        run: |
          python - <<'PY'
          from pathlib import Path

          llm = Path('swos_runtime/llm.py')
          text = llm.read_text(encoding='utf-8')
          anchor = '''    def revise(\n        self,\n        article: str,\n'''
          method = '''    def plan_review_repair(\n        self, topic: str, findings: list[dict[str, Any]]\n    ) -> dict[str, Any]:\n        schema = _object_schema(\n            {\n                "research_goal": {"type": "string"},\n                "queries": {\n                    "type": "array",\n                    "minItems": 2,\n                    "maxItems": 6,\n                    "items": {"type": "string"},\n                },\n            },\n            ["research_goal", "queries"],\n        )\n        instructions = """You are the SWOS Research Repair Planner. Convert blocker/major reviewer findings into targeted research queries only.\nSeek evidence that directly resolves the cited defect: period-specific or primary documentary evidence, specialist scholarly or museum/conservation evidence, and concrete counterexamples or boundary cases when requested.\nDo not answer the research question, do not invent sources, and do not ask the user. Prefer queries likely to retrieve authoritative full-text pages rather than generic commentary."""\n        compact = [\n            {\n                "category": finding.get("category"),\n                "description": finding.get("description"),\n                "required_action": finding.get("required_action"),\n            }\n            for finding in findings\n        ]\n        return self.json_call(\n            "review_research_plan",\n            instructions,\n            {"topic": topic, "blocking_findings": compact},\n            schema,\n            max_output_tokens=4000,\n        )\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('llm revise anchor mismatch')
          text = text.replace(anchor, method + anchor)
          llm.write_text(text, encoding='utf-8')

          orch = Path('swos_runtime/orchestrator.py')
          text = orch.read_text(encoding='utf-8')

          anchor = '''    @staticmethod\n    def _source_labels(sources: list[SourceRecord]) -> dict[str, str]:\n'''
          helper = '''    @staticmethod\n    def _review_requires_research(findings: list[dict[str, Any]]) -> bool:\n        research_categories = {\n            "fabricated_citation",\n            "citation_metadata_error",\n            "citation_laundering",\n            "unsupported_claim",\n            "overclaim",\n            "missing_counter_evidence",\n            "coverage_gap",\n            "source_bias",\n            "hidden_premise",\n            "invalid_inference",\n            "over_association",\n            "genre_mismatch",\n        }\n        return any(finding.get("category") in research_categories for finding in findings)\n\n    @staticmethod\n    def _enforce_requested_title(article: str, topic: str) -> str:\n        match = re.search(r"\\btitled\\s+['\\\"]([^'\\\"]+)['\\\"]", topic, flags=re.IGNORECASE)\n        if not match:\n            return article\n        requested = match.group(1).strip()\n        if not requested:\n            return article\n        if re.search(r"(?m)^#\\s+.+$", article):\n            return re.sub(r"(?m)^#\\s+.+$", f"# {requested}", article, count=1)\n        return f"# {requested}\\n\\n{article.lstrip()}"\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('orchestrator helper anchor mismatch')
          text = text.replace(anchor, helper + anchor)

          old = '''            article = self.stage_provider.draft(\n                request.to_dict(), plan, evidence_rows, argument_raw, source_labels\n            )\n            states.append(_state_entry("draft_generated", "build", "draft-complete"))\n            chain.append("draft.generated", {"body_words": body_word_count(article)})\n            article, prose_evidence = self._apply_prose(article, request)\n            for iteration in range(1, 4):\n                review_result = self.stage_provider.review(\n                    article, evidence_rows, argument_raw, ranked, iteration=iteration\n                )\n                documents = self._review_documents(work_id, review_result, iteration)\n                latest_review_documents = documents\n                all_review_documents.extend(documents)\n                blocking = self._blocking_findings(documents)\n                if not blocking:\n                    break\n                if iteration == 3:\n                    break\n                article = self.stage_provider.revise(\n                    article, blocking, evidence_rows, argument_raw, source_labels\n                )\n                revision_count += 1\n                article, revision_prose = self._apply_prose(article, request)\n                prose_evidence.setdefault("revision_passes", []).append(revision_prose)\n'''
          new = '''            article = self.stage_provider.draft(\n                request.to_dict(), plan, evidence_rows, argument_raw, source_labels\n            )\n            article = self._enforce_requested_title(article, request.topic)\n            states.append(_state_entry("draft_generated", "build", "draft-complete"))\n            chain.append("draft.generated", {"body_words": body_word_count(article)})\n            article, prose_evidence = self._apply_prose(article, request)\n            article = self._enforce_requested_title(article, request.topic)\n            for iteration in range(1, 5):\n                review_result = self.stage_provider.review(\n                    article, evidence_rows, argument_raw, ranked, iteration=iteration\n                )\n                documents = self._review_documents(work_id, review_result, iteration)\n                latest_review_documents = documents\n                all_review_documents.extend(documents)\n                blocking = self._blocking_findings(documents)\n                if not blocking:\n                    break\n                if iteration == 4:\n                    break\n\n                research_repaired = False\n                if self._review_requires_research(blocking):\n                    repair_plan = self.stage_provider.plan_review_repair(request.topic, blocking)\n                    repair_queries = [\n                        str(query).strip()\n                        for query in repair_plan.get("queries", [])\n                        if str(query).strip()\n                    ][:6]\n                    before_keys = {\n                        (source.identifiers.get("doi") or source.url or source.title).lower()\n                        for source in sources\n                    }\n                    expanded = self.retriever.retrieve(request.topic, repair_queries)\n                    added: list[SourceRecord] = []\n                    for source in expanded:\n                        key = (source.identifiers.get("doi") or source.url or source.title).lower()\n                        if key in before_keys:\n                            continue\n                        before_keys.add(key)\n                        sources.append(source)\n                        added.append(source)\n\n                    repair_record = {\n                        "attempt": len(research_expansions) + 1,\n                        "phase": "review_repair",\n                        "review_iteration": iteration,\n                        "trigger_categories": sorted(\n                            {str(finding.get("category")) for finding in blocking}\n                        ),\n                        "research_goal": repair_plan.get("research_goal"),\n                        "queries": repair_queries,\n                        "new_sources": len(added),\n                    }\n                    research_expansions.append(repair_record)\n                    chain.append("research.review_repair", repair_record)\n\n                    if added:\n                        old_ranked = ranked\n                        old_rerank = rerank_record\n                        old_labels = labels\n                        old_matrix = evidence_matrix\n                        old_rows = evidence_rows\n                        old_argument_graph = argument_graph\n                        old_argument_raw = argument_raw\n\n                        ranked, rerank_record = self.stage_provider.rerank(\n                            request.topic, sources, top_k=12\n                        )\n                        for source in ranked:\n                            source.injection_detected = (\n                                source.injection_detected\n                                or detect_prompt_injection(source.text)\n                            )\n                        labels = self._source_labels(ranked)\n                        rebuild_evidence()\n                        used_source_ids = {row["source_id"] for row in evidence_rows}\n                        evidence_gate_ok = (\n                            len(evidence_rows) >= 5\n                            and evidence_matrix["coverage"].get("counter_evidence_present")\n                            and (\n                                not _legal_topic(request.topic)\n                                or any(\n                                    source.primary and source.source_id in used_source_ids\n                                    for source in ranked\n                                )\n                            )\n                        )\n                        if evidence_gate_ok:\n                            for row in evidence_rows:\n                                row["source_marker"] = labels[row["source_id"]]\n                            argument_graph, argument_raw = self._build_argument_graph(\n                                work_id,\n                                request.topic,\n                                evidence_rows,\n                                plan.get("rival_theses", []),\n                            )\n                            states.append(\n                                _state_entry(\n                                    "evidence_gathering",\n                                    "build",\n                                    "review-driven-research-complete",\n                                )\n                            )\n                            states.append(\n                                _state_entry(\n                                    "evidence_verified",\n                                    "validate",\n                                    "review-driven-evidence-pass",\n                                )\n                            )\n                            states.append(\n                                _state_entry(\n                                    "argument_constructed",\n                                    "build",\n                                    "review-driven-argument-rebuild",\n                                )\n                            )\n                            article = self.stage_provider.draft(\n                                request.to_dict(),\n                                plan,\n                                evidence_rows,\n                                argument_raw,\n                                labels,\n                            )\n                            article = self._enforce_requested_title(article, request.topic)\n                            source_labels = labels\n                            research_repaired = True\n                        else:\n                            ranked = old_ranked\n                            rerank_record = old_rerank\n                            labels = old_labels\n                            evidence_matrix = old_matrix\n                            evidence_rows = old_rows\n                            argument_graph = old_argument_graph\n                            argument_raw = old_argument_raw\n\n                if not research_repaired:\n                    argument_categories = {"hidden_premise", "invalid_inference", "structure"}\n                    if any(\n                        finding.get("category") in argument_categories for finding in blocking\n                    ):\n                        argument_graph, argument_raw = self._build_argument_graph(\n                            work_id,\n                            request.topic,\n                            evidence_rows,\n                            plan.get("rival_theses", []),\n                        )\n                    article = self.stage_provider.revise(\n                        article, blocking, evidence_rows, argument_raw, source_labels\n                    )\n                    article = self._enforce_requested_title(article, request.topic)\n\n                revision_count += 1\n                article, revision_prose = self._apply_prose(article, request)\n                article = self._enforce_requested_title(article, request.topic)\n                prose_evidence.setdefault("revision_passes", []).append(revision_prose)\n'''
          if text.count(old) != 1:
              raise SystemExit('review loop anchor mismatch')
          text = text.replace(old, new)

          anchor = '''        for document in all_review_documents:\n'''
          persist = '''        # Persist the final research/evidence/argument state after any reviewer-driven repairs.\n        labels = self._source_labels(ranked)\n        _write_json(\n            output / "retrieval.json",\n            {\n                "queries": plan.get("queries", []),\n                "research_expansions": research_expansions,\n                "retriever_events": getattr(self.retriever, "events", []),\n                "source_count": len(sources),\n            },\n        )\n        _write_json(output / "reranking.json", rerank_record)\n        _write_json(\n            output / "source-register.json",\n            [\n                {**source.to_dict(include_text=False), "marker": labels.get(source.source_id)}\n                for source in ranked\n            ],\n        )\n        security_events = [\n            {\n                "event": "security.injection_attempt",\n                "source_id": source.source_id,\n                "title": source.title,\n                "instruction_followed": False,\n                "content_preserved_in_source_record": True,\n            }\n            for source in ranked\n            if source.injection_detected\n        ]\n        _write_json(output / "security-report.json", {"events": security_events})\n        _write_json(output / "evidence-matrix.json", evidence_matrix)\n        _write_json(output / "evidence-rejections.json", rejected_evidence)\n        _write_json(output / "argument-graph.json", argument_graph)\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('review persistence anchor mismatch')
          text = text.replace(anchor, persist + anchor)
          orch.write_text(text, encoding='utf-8')
          PY
      - name: Install locked developer tools
        run: python -m pip install --requirement requirements-dev.lock
      - name: Format, lint and test runtime
        run: |
          python -m ruff format swos_runtime/llm.py swos_runtime/orchestrator.py
          python -m ruff check swos_runtime/llm.py swos_runtime/orchestrator.py
          python -m unittest discover -s tests/runtime -p 'test_*.py'
      - name: Commit review-repair control loop
        run: |
          git config user.name "Reza Negarestani"
          git config user.email "13441247+rezanet@users.noreply.github.com"
          git add swos_runtime/llm.py swos_runtime/orchestrator.py
          git commit -m "fix(runtime): route reviewer blockers back to research" -m "Signed-off-by: Reza Negarestani <13441247+rezanet@users.noreply.github.com>"
          git push origin HEAD:programme/autonomous-swos
