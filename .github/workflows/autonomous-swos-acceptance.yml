name: Autonomous SWOS Canonical Acceptance — G-HOST API Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SWOS_RUNTIME_MODEL: gpt-5.6-luna
  SWOS_RUNTIME_REVIEW_MODEL: gpt-5.6-luna
  SWOS_PROSE_OPENAI_MODEL: gpt-5.6-luna
  SWOS_PROSE_OPENAI_REWRITE_MODEL: gpt-5.6-luna

jobs:
  canonical-legal-ai:
    name: G-HOST A — API canonical legal-AI article
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require configured live provider credential
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "Provider API credential is not configured. G-HOST API baseline is NOT RUN and cannot pass." >&2
            exit 2
          fi
      - name: Install locked environment and SWOS
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation --editable .
      - name: Run exact one-request canonical workflow
        id: canonical
        continue-on-error: true
        run: |
          rm -rf /tmp/swos-autonomous-canonical
          set -o pipefail
          swos research-write \
            --adapter openai-api \
            --topic "Can an AI-operated machine be a witness in court?" \
            --length 2500 \
            --audience "intelligent general reader" \
            --style scholarly-natural \
            --depth rigorous \
            --output /tmp/swos-autonomous-canonical \
            --json 2>&1 | tee /tmp/swos-autonomous-cli.log
      - name: Validate complete governed outcome contract
        run: python tools/validate_autonomous_run.py /tmp/swos-autonomous-canonical --canonical
      - name: Generate G-HOST API portability evidence record
        run: |
          python tools/record_portability_acceptance.py \
            openai_api \
            /tmp/swos-autonomous-canonical \
            --output /tmp/openai_api-portability-evidence.json
      - name: Summarise canonical evidence
        if: always()
        run: |
          echo '## SWOS G-HOST API baseline' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f /tmp/swos-autonomous-canonical/run-control.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/swos-autonomous-canonical/run-control.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No governed run-control artefact was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload complete canonical run and portability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g-host-api-canonical-legal-ai
          path: |
            /tmp/swos-autonomous-canonical
            /tmp/swos-autonomous-cli.log
            /tmp/openai_api-portability-evidence.json
          retention-days: 14
