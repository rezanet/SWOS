name: SWOS Release Candidate Evidence

on:
  workflow_dispatch:
    inputs:
      selected_sha:
        description: Full 40-character commit SHA to evaluate
        required: true
        type: string

permissions:
  contents: read

jobs:
  public-proof:
    name: Public proof and independent reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.selected_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact selected SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.selected_sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Install locked deterministic dependencies
        run: python -m pip install --requirement requirements-dev.lock
      - name: Execute canonical public proof
        run: >-
          python tools/run_public_proof.py
          --project examples/public-proof/project.json
          --out release-evidence/public-proof-primary
      - name: Independently reproduce public proof
        run: >-
          python tools/verify_public_proof.py
          --project examples/public-proof/project.json
          --primary release-evidence/public-proof-primary
          --reproduce-at release-evidence/public-proof-independent
          --out release-evidence/reproduction-report.json
      - name: Record exact selected SHA
        run: git rev-parse HEAD > release-evidence/selected-sha.txt
      - name: Upload unsigned evidence
        uses: actions/upload-artifact@v4
        with:
          name: swos-public-proof-${{ inputs.selected_sha }}
          path: release-evidence/
          retention-days: 30

  authority-boundary:
    name: Human approval and external signature required
    runs-on: ubuntu-latest
    needs: public-proof
    steps:
      - name: Preserve fail-closed release boundary
        run: |
          echo "Public proof passed; release remains blocked until exact human approval and external swos-release signature are supplied."
