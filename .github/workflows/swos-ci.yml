name: SWOS CI

# Release gates are enforced here, not in documentation.
# A merge to main that degrades any evaluation plane is blocked.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Schema and contract conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema pyyaml
      - name: Validate all artefacts against frozen schemas
        run: python3 tools/validate_schemas.py --strict

  portability:
    name: Agent Skills six-field constraint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Reject host-specific frontmatter in core skills
        run: python3 tools/lint_skills.py --strict

  prose:
    name: SWOS Prose semantic-delta tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run semantic-delta unit tests
        run: python3 -m unittest discover -s tests/prose -p 'test_*.py'

  prose-openai-live:
    name: SWOS Prose OpenAI live evidence
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SWOS_PROSE_RUN_LIVE_OPENAI: "1"
      SWOS_PROSE_OPENAI_MODEL: gpt-5.6-luna
      SWOS_PROSE_OPENAI_REWRITE_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Report live-test skip when no API key is configured
        if: env.OPENAI_API_KEY == ''
        run: echo "OPENAI_API_KEY is not configured; live SWOS Prose evidence skipped."
      - name: Install OpenAI SDK
        if: env.OPENAI_API_KEY != ''
        run: python3 -m pip install openai
      - name: Run live OpenAI semantic-verifier regressions
        id: live-verifier
        if: env.OPENAI_API_KEY != ''
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests/prose -p 'test_openai_live.py' 2>&1 \
            | tee /tmp/swos-prose-live-verifier.log
      - name: Run five-case polish dogfood batch
        if: env.OPENAI_API_KEY != '' && always()
        run: |
          rm -rf /tmp/swos-prose-dogfood
          python3 -m swos_prose.cli dogfood \
            --input-dir tests/prose/fixtures/live_dogfood \
            --output-dir /tmp/swos-prose-dogfood \
            --assurance strict \
            --rewriter-model gpt-5.6-luna \
            --verifier-model gpt-5.6-luna \
            --skip-diagnostics
          cat /tmp/swos-prose-dogfood/summary.json
          {
            echo '## SWOS Prose live evidence'
            echo
            echo "Verifier regression step outcome: ${{ steps.live-verifier.outcome }}"
            echo
            echo '```json'
            cat /tmp/swos-prose-dogfood/summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload live evidence
        if: env.OPENAI_API_KEY != '' && always()
        uses: actions/upload-artifact@v4
        with:
          name: swos-prose-live-evidence
          path: |
            /tmp/swos-prose-dogfood
            /tmp/swos-prose-live-verifier.log
          retention-days: 7

  evaluation:
    name: Evaluation harness (release gate)
    runs-on: ubuntu-latest
    needs: [contracts]
    strategy:
      fail-fast: false
      matrix:
        plane: [retrieval, grounding, citation, scholarly, governance, regression, memory_contamination, adversarial]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - name: Run evaluation plane
        run: python3 evals/harness/run_evals.py --planes ${{ matrix.plane }} --fail-on-gate

  governance:
    name: Governance policy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - name: Provenance completeness and policy-as-code validation
        run: python3 tools/check_governance.py

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine DCO commit range
        id: dco-range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$BEFORE_SHA"
            head="$CURRENT_SHA"
          else
            head="$CURRENT_SHA"
            if git rev-parse "${head}^" >/dev/null 2>&1; then
              base="$(git rev-parse "${head}^")"
            else
              base="0000000000000000000000000000000000000000"
            fi
          fi

          if [[ -z "$head" ]]; then
            echo "Unable to determine DCO head SHA" >&2
            exit 2
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "DCO range base: ${base:-<none>}"
          echo "DCO range head: $head"

      - name: Verify Signed-off-by on all selected commits
        run: >-
          python3 tools/check_dco.py
          "${{ steps.dco-range.outputs.base }}"
          "${{ steps.dco-range.outputs.head }}"
