name: SWOS CI

# Release gates are enforced here, not in documentation.
# A merge to main that degrades any evaluation plane is blocked.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Schema and contract conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema pyyaml
      - name: Validate all artefacts against frozen schemas
        run: python3 tools/validate_schemas.py --strict
      - name: Validate documentation authority manifest
        run: python3 tools/validate_document_manifest.py
      - name: Inspect deterministic and live workflow profiles
        run: python3 tools/check_workflow_profiles.py
      - name: Run foundation manifest and workflow tests
        run: python3 -m unittest tests/test_document_manifest.py tests/test_workflow_profiles.py tests/test_spec_kit_artifacts.py
      - name: Run Spec Kit artifact consistency analysis
        run: python3 tools/check_spec_kit_artifacts.py

  portability:
    name: Agent Skills six-field constraint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Reject host-specific frontmatter in core skills
        run: python3 tools/lint_skills.py --strict

  prose:
    name: SWOS Prose semantic-delta tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaged SWOS Prose surface
        run: python3 -m pip install --no-deps --no-build-isolation -e .
      - name: Smoke test packaged CLI entry point
        run: swos-prose --help >/dev/null
      - name: Run semantic-delta unit tests
        run: python3 -m unittest discover -s tests/prose -p 'test_*.py'

  evaluation:
    name: Evaluation harness (release gate)
    runs-on: ubuntu-latest
    needs: [contracts]
    strategy:
      fail-fast: false
      matrix:
        plane: [retrieval, grounding, citation, scholarly, governance, regression, memory_contamination, adversarial]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - name: Run evaluation plane against Autonomous SWOS
        run: python3 evals/harness/run_evals.py --planes ${{ matrix.plane }} --system autonomous-swos --deterministic-subject --fail-on-gate

  governance:
    name: Governance policy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - name: Provenance completeness and policy-as-code validation
        run: python3 tools/check_governance.py

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine DCO commit range
        id: dco-range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$BEFORE_SHA"
            head="$CURRENT_SHA"
          else
            head="$CURRENT_SHA"
            if git rev-parse "${head}^" >/dev/null 2>&1; then
              base="$(git rev-parse "${head}^")"
            else
              base="0000000000000000000000000000000000000000"
            fi
          fi

          if [[ -z "$head" ]]; then
            echo "Unable to determine DCO head SHA" >&2
            exit 2
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "DCO range base: ${base:-<none>}"
          echo "DCO range head: $head"

      - name: Verify Signed-off-by on all selected commits
        run: >-
          python3 tools/check_dco.py
          "${{ steps.dco-range.outputs.base }}"
          "${{ steps.dco-range.outputs.head }}"
