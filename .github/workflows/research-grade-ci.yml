name: Research Grade compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e .

      - name: Validate frozen v1 and versioned v2 schemas
        run: python tools/validate_schemas.py --strict

      - name: Validate the recorded v1 compatibility manifest
        run: python -m unittest tests.runtime.test_research_grade_compatibility

      - name: Validate executable v2 examples
        run: python tools/validate_contract_examples.py

      - name: Run compatibility contracts
        run: python -m unittest tests.runtime.test_research_grade_schemas

      - name: Run compatibility manifest and workflow contracts
        run: python -m unittest tests.runtime.test_research_grade_ci

      - name: Verify no v1 contract bytes changed relative to the PR base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --exit-code "origin/${{ github.base_ref }}" -- \
            contracts/capability-contract/capabilities-v1.json \
            contracts/stage-instruction/stage-instructions-v1.json \
            schemas

      - name: Require the compatibility manifest in the candidate
        run: test -f tests/fixtures/research-grade/v1-compatibility-manifest.json

      - name: Verify clean patch formatting
        run: git diff --check HEAD^ HEAD

      - name: Assert optional live credentials are not consumed by ordinary CI
        shell: bash
        run: |
          test -z "${OPENAI_API_KEY:-}"
          test -z "${MODEL_REGISTRY_TOKEN:-}"
