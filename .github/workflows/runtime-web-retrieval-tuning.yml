name: One-shot Web Retrieval Tuning

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-web-retrieval-tuning.yml"

permissions:
  contents: write

jobs:
  tune-web-retrieval:
    if: github.head_ref == 'programme/autonomous-swos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: programme/autonomous-swos
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bound web-search and page-fetch budgets
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('swos_runtime/retrieval.py')
          text = path.read_text(encoding='utf-8')

          old = 'def _html_text(url: str) -> str:\n    raw = _urlopen(url)\n'
          new = 'def _html_text(url: str, *, timeout: int = 30) -> str:\n    raw = _urlopen(url, timeout=timeout)\n'
          if text.count(old) != 1:
              raise SystemExit(f'_html_text signature anchor mismatch count={text.count(old)}')
          text = text.replace(old, new)

          marker = '    def _openai_web(self, query: str, *, limit: int = 3) -> list[SourceRecord]:\n'
          if text.count(marker) != 1:
              raise SystemExit('openai web marker mismatch')
          before, web_section = text.split(marker, 1)
          old_fetch = '                text = _html_text(url)\n'
          if old_fetch not in web_section:
              raise SystemExit('openai web fetch anchor missing')
          web_section = web_section.replace(
              old_fetch, '                text = _html_text(url, timeout=8)\n', 1
          )
          text = before + marker + web_section

          old_budget = (
              '        for query in queries[:4]:\n'
              '            found.extend(self._openai_web(query, limit=3))\n'
          )
          new_budget = (
              '        for query in queries[:3]:\n'
              '            found.extend(self._openai_web(query, limit=2))\n'
          )
          if text.count(old_budget) != 1:
              raise SystemExit(f'web search budget anchor mismatch count={text.count(old_budget)}')
          text = text.replace(old_budget, new_budget)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install locked developer tools
        run: python -m pip install --requirement requirements-dev.lock
      - name: Format, lint and run runtime tests
        run: |
          python -m ruff format swos_runtime/retrieval.py
          python -m ruff check swos_runtime/retrieval.py
          python -m unittest discover -s tests/runtime -p 'test_*.py'
      - name: Commit bounded retrieval tuning
        run: |
          git config user.name "Reza Negarestani"
          git config user.email "13441247+rezanet@users.noreply.github.com"
          git add swos_runtime/retrieval.py
          git commit -m "perf(retrieval): bound web authority discovery latency" -m "Signed-off-by: Reza Negarestani <13441247+rezanet@users.noreply.github.com>"
          git push origin HEAD:programme/autonomous-swos
