name: Research T094 ProvToolbox package build

on:
  push:
    branches:
      - research/research-grade-external-evidence-2026-09-03
    paths:
      - research/research-grade-external-evidence/T094-BUILD-PROVTOOLBOX-PACKAGE.py
      - research/research-grade-external-evidence/T094-ORACLE-ADAPTER.py
      - .github/workflows/t094-provtoolbox-package-research.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t094-provtoolbox-package-research
  cancel-in-progress: false

jobs:
  build:
    name: Build pinned offline oracle artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/research-grade-external-evidence-2026-09-03
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build deterministic ProvToolbox 2.2.3 package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t094"
          python research/research-grade-external-evidence/T094-BUILD-PROVTOOLBOX-PACKAGE.py \
            --output "$RUNNER_TEMP/t094/provtoolbox-oracle-2.2.3.pyz" \
            --manifest-out "$RUNNER_TEMP/t094/provtoolbox-oracle-2.2.3.manifest.json"

      - name: Verify artifact is executable zip and complete
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          root = Path("${{ runner.temp }}/t094")
          artifact = root / "provtoolbox-oracle-2.2.3.pyz"
          manifest = json.loads((root / "provtoolbox-oracle-2.2.3.manifest.json").read_text())
          assert artifact.is_file() and artifact.stat().st_size > 0
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == manifest["artifact"]["sha256"]
          assert manifest["implementation"] == "ProvToolbox"
          assert manifest["version"] == "2.2.3"
          assert manifest["independent_execution"] == "NOT_RUN"
          assert manifest["independent_approval"] is None
          assert not Path(manifest["artifact"]["path"]).is_absolute()
          assert manifest["runtime"]["java_executable"] == "java"
          assert not Path(manifest["runtime"]["java_executable"]).is_absolute()
          assert manifest["artifact_contract"]["single_file"] is True
          assert manifest["artifact_contract"]["python_zipapp"] is True
          with zipfile.ZipFile(artifact) as z:
              names = set(z.namelist())
              assert "__main__.py" in names
              assert "package-manifest.json" in names
              assert "LICENSE-provtoolbox.txt" in names
              assert any(name.startswith("lib/provconvert-2.2.3") and name.endswith(".jar") for name in names)
              assert len([name for name in names if name.startswith("lib/") and name.endswith(".jar")]) >= 2
          print(json.dumps({"artifact_sha256": manifest["artifact"]["sha256"], "bytes": artifact.stat().st_size}, sort_keys=True))
          PY

      - name: Upload exact package for external approval/execution handoff
        uses: actions/upload-artifact@v4
        with:
          name: t094-provtoolbox-oracle-package-${{ github.sha }}
          path: |
            ${{ runner.temp }}/t094/provtoolbox-oracle-2.2.3.pyz
            ${{ runner.temp }}/t094/provtoolbox-oracle-2.2.3.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Persist package manifest only on latest research head
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/t094/provtoolbox-oracle-2.2.3.manifest.json" \
             research/research-grade-external-evidence/T094-PROVTOOLBOX-PACKAGE-MANIFEST.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/research-grade-external-evidence/T094-PROVTOOLBOX-PACKAGE-MANIFEST.json
          if git diff --cached --quiet; then
            echo "Generated T094 manifest unchanged; nothing to commit."
            exit 0
          fi
          git commit -s -m "research: record T094 ProvToolbox package manifest" \
            -m "Preparation only; source workflow commit: ${SOURCE_SHA}. Independent approval/execution remain NOT_RUN."
          git fetch origin research/research-grade-external-evidence-2026-09-03
          git rebase origin/research/research-grade-external-evidence-2026-09-03
          git push origin HEAD:research/research-grade-external-evidence-2026-09-03
